# main branch pe push hote hi /game folder GitHub Pages pe deploy.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Koi secret ya sales CSV to nahi ja raha?
        run: |
          if grep -rIlE "sk-ant-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{30,}" game; then echo "Key jaisa kuch mila, deploy roka."; exit 1; fi
          if find game -name "*.csv" ! -name "SAMPLE_*" | grep .; then echo "Sales CSV mila, deploy roka."; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
